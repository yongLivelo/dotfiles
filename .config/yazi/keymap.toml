[[mgr.prepend_keymap]]
on = "u"
run = "plugin action-history -- --action=undo"
desc = "Undo last file operation"

[[mgr.prepend_keymap]]
on = "U"
run = "plugin action-history -- --action=redo"
desc = "Redo last undone file operation"

[[mgr.prepend_keymap]]
on = "a"
run = "plugin action-history -- --action=create"
desc = "Create a file or directory (tracked)"

[[mgr.prepend_keymap]]
on = "y"
run = ["yank", "plugin sys-clipboard -- --action=copy"]
desc = "Yank selected files (copy)"

[[mgr.prepend_keymap]]
on = "x"
run = ["yank --cut", "plugin sys-clipboard -- --action=copy"]
desc = "Yank selected files (cut)"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = ["plugin sys-clipboard -- --action=paste"]
desc = "Paste yanked system clipboard files"


[[mgr.prepend_keymap]]
on = ["c", "a", "a"]
run = "plugin compress"
desc = "Archive selected files"
