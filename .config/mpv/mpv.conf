# MPV configuration

# Video output & hardware decoding
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe

# Window & playback behavior
keep-open=yes
save-position-on-quit=yes
autofit-larger=100%x100%
volume=100
volume-max=150

# OSD & Subtitles (Tokyo Night palette & JetBrains Mono)
osd-font="JetBrains Mono"
osd-font-size=28
osd-color="#c0caf5"
osd-border-color="#1a1b26"
osd-bar=yes
osd-bar-w=60
osd-bar-h=2

sub-auto=fuzzy
sub-font="JetBrains Mono"
sub-font-size=36
sub-color="#c0caf5"
sub-border-color="#1a1b26"

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures
screenshot-template="mpv-%F-%P"
