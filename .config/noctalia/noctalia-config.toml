[bar.default]
background_opacity = 0.5
capsule = true
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "control-center" ]
start = [ "launcher", "workspaces", "session", "Hibernate" ]

[shell]
font_family = "JetBrains Mono"
polkit_agent = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "pywalfox", "lazygit", "yazi" ]

[wallpaper]
directory = "~/dotfiles/others/backgrounds"

    [wallpaper.default]
    path = "~/dotfiles/others/backgrounds/tokyonight_original.png"

[widget.Hibernate]
glyph = "hibernate"
type = "custom_button"

    [widget.Hibernate.actions]
    left = "exec systemctl hibernate"

[widget.clock]
format = "{:%-I:%M %p, %a %b %d}"

[widget.network]
show_label = false
