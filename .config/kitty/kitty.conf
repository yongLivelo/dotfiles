hide_window_decorations yes
cursor_trail 1
window_padding_width 4
copy_on_select clipboard
# pass ctrl+shift+c to the program (nvim uses it to save and quit); mouse selection still copies
map kitty_mod+c

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
include themes/noctalia.conf
