# General & Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000

# True color & undercurl support for kitty (Tokyo Night & Neovim LSP diagnostics)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Forward shift+ctrl combos (nvim uses ctrl+shift+c to save and quit)
set -g extended-keys on
set -as terminal-features ",xterm-kitty:extkeys"

# Prefix
unbind C-b
set -g prefix C-a
bind a send-prefix
bind-key -T prefix C-a run-shell 'sesh-term --popup'

# Scrollback popup (inherits kitty palette, cleans up temp file, exits on Ctrl+c or q)
bind E run-shell 'f=$(mktemp /tmp/tmux-scrollback.XXXXXX) && tmux capture-pane -e -t #{pane_id} -S - -E - -p > "$f" && tmux display-popup -E -b rounded -T " Scrollback " -w 90% -h 90% -s "fg=default,bg=colour0" -S "fg=colour4,bg=colour0" "trap \"rm -f $f\" EXIT; nvim -u NONE -c \"set laststatus=0 showtabline=0 nonumber norelativenumber signcolumn=no scrollback=100000 termguicolors\" -c \"nnoremap <silent> <C-c> :qa!<CR>\" -c \"tnoremap <silent> <C-c> <C-\\\\><C-n>:qa!<CR>\" -c \"nnoremap <silent> q :qa!<CR>\" -c \"terminal cat $f\" -c \"normal G\""'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Tokyo Night theme options
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_git 1

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Overrides placed after TPM so tmux-sensible doesn't overwrite them
set -sg escape-time 10
